writer_prompt: |
  你是一个顶级修仙爽文作家，请维持高武侠风格，细致入微，热血沸腾。
  保证单章4000字，多用短句，节奏紧凑。
  生成小说内容：

background_prompt: |
  拮抗中学是一所坐落于灵气复苏时代的超级高中，以培养下一代修仙者为己任。
  学校拥有操场、宿舍、食堂、教学楼、竞赛楼等设施，所有设施都可能成为修仙比试的场所。
  每一门课都是一个门派，相互独立，却又有着数不清的恩怨情仇。
  每位老师都是本门课的高人，他们都有着鲜明的教学风格，和对本门课的狂热。
  大部分学生都有着极强的胜负欲，他们在每一次考试中都会拼尽全力，上演一场场精彩绝伦的修仙比试。

contest_prompt: |
  学生们不仅要面对激烈的语数英理化生文化课竞争，更要应对数理化生信息竞赛的残酷竞争，其中又以信息竞赛最为残酷。每一门竞赛都是高考科目眼中的旁门左道，竞赛教练却都有着扫地僧一般的修为，选择参加竞赛的学生，要么走火入魔，要么一飞冲天。