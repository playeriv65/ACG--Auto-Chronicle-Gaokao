writer_prompt: |
  你是一个顶级修仙爽文作家，请维持高武侠风格，细致入微，热血沸腾。
  保证单章4000字，多用短句，节奏紧凑。
  生成小说内容：

background_prompt: |
  拮抗中学是一所坐落于灵气复苏时代的超级高中，以培养下一代修仙者为己任。
  学校拥有操场、宿舍、食堂、教学楼、竞赛楼等设施，所有设施都可能成为修仙比试的场所。
  每一门课都是一个门派，相互独立，却又有着数不清的恩怨情仇。
  每位老师都是本门课的高人，他们都有着鲜明的教学风格，和对本门课的狂热。
  大部分学生都有着极强的胜负欲，他们在每一次考试中都会拼尽全力，上演一场场精彩绝伦的修仙比试。

contest_prompt: |
  学生们不仅要面对激烈的语数英理化生文化课竞争，更要应对数理化生信息竞赛的残酷竞争，其中又以信息竞赛最为残酷。每一门竞赛都是高考科目眼中的旁门左道，竞赛教练却都有着扫地僧一般的修为，选择参加竞赛的学生，要么走火入魔，要么一飞冲天。

ai_writer:
  chapter_end_marker: "[CHAPTER_END]"
  continue_expand_prompt: "（字数不足，请继续深度扩写剧情细节，严禁收尾！）"
  truncation_notice: "\n\n（此处因篇幅过长，天道强行截断...）"
  scene:
    user_template: |
      【数据包】
      {stats_context}

      【大纲】
      {prompt}

      请开笔：
  quiz:
    system: "你是一名精准的命题机器。"
    user_template: "请针对高中{subject}知识点【{topic}】设计1道选择题。输出格式：【题目】、答案和解析。总字数控制在150字以内，不要任何废话。"
  summary:
    system: "你是一个严谨的剧情记录员。"
    instruction_template: "请简要总结第{chapter_num}章的核心剧情发展、人物变动和关键信息。字数控制在200字以内。"
    user_template: |
      【章节内容】
      {content}

      【指令】
      {instruction}

main:
  scene_stats_context: "维持高武侠风格，写满4000字。"
  system_instruction_template: "你是一个{role}。风格要求：{style}。创作要求：{requirements}。完结后输出 {chapter_end_marker}。"
  time_anchor_template: "【时间锚点】当前为{term_label}第{week_num}周（公历{plan_date}，节点{date_key}）。"
  time_guardrail_template: "【时间守则】本章叙事必须严格服从以上时间，不得写成其他年级/学期/日期，不得跨周跳时。"
  scene_prompt_template: |
    【世界观】
    {world_description}

    {time_anchor_text}

    【节点】{date_key} ({plan_date}) {battle_type}
    【剧本大纲】
    {details_text}
    【主角现状】{mc_detail_text}
    【真题回顾】{quiz_text}
  quiz_empty_text: "暂无"
